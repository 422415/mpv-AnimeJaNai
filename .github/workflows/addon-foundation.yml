name: Addon foundation

on:
  push:
    branches: [feature/addon-foundation]
    paths: ['addons/**', 'BuildMpvUpscale2xAnimeJaNai/**/animejanai_addons.lua', '.github/workflows/addon-foundation.yml']
  pull_request:
    paths: ['addons/**', 'BuildMpvUpscale2xAnimeJaNai/**/animejanai_addons.lua', '.github/workflows/addon-foundation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Download and verify sandbox tools
        shell: pwsh
        run: ./addons/tools/bootstrap.ps1
      - name: Run contract and real worker tests
        shell: pwsh
        run: ./addons/tools/test.ps1
      - name: Build the Windows lifecycle launcher
        shell: pwsh
        run: dotnet build ./addons/src/AnimeJaNai.Addons.Launcher -c Release
      - name: Validate the creator tutorial and offline documentation
        shell: pwsh
        run: |
          ./addons/tools/check-docs.ps1
          $tools = Get-Content ./addons/.tools/tools.json -Raw | ConvertFrom-Json
          ./addons/tools/test-tutorial.ps1 -HostExecutable ./addons/src/AnimeJaNai.Addons/bin/Release/net10.0/ajn-addon.exe -Compiler $tools.javy.path -Runtime $tools.wasmtime.path -OutputDirectory ./addons/.work/tutorial
          New-Item -ItemType Directory ./addons/.work/docs | Out-Null
          Copy-Item ./addons/*.md ./addons/.work/docs
          ./addons/tools/render-docs.ps1 -Directory ./addons/.work/docs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-foundation-results
          path: |
            addons/.work/validation/**/results.json
            addons/.work/validation/**/control-latency.json
            addons/.work/tutorial/results.json
            addons/.work/docs/*.html
          if-no-files-found: warn
